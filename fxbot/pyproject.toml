[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fxbot"
version = "1.0.0"
description = "Trend-following FX bot for MetaTrader 5 (Pepperstone Razor)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  # Windows-only wheel. The marker is REQUIRED: without it `pip install -e .` fails on
  # Linux/macOS, and §2.1 deliberately keeps `backtest/` free of MetaTrader5 so research
  # runs anywhere.
  "MetaTrader5==5.0.6180 ; sys_platform == 'win32'",
  "pandas==2.2.3",
  "numpy==1.26.4",           # <2.0 - Backtrader breaks on numpy 2.x
  "pydantic==2.9.2",
  "pydantic-settings==2.6.0",
  "PyYAML==6.0.2",
  "backtrader==1.9.78.123",
  "matplotlib==3.7.5",       # >=3.8 breaks Backtrader plotting
  "pyarrow==17.0.0",
  "structlog==24.4.0",
  "httpx==0.27.2",
  "tenacity==9.0.0",
  "typer==0.12.5",
  # typer 0.12.5 predates click 8.2's Parameter.make_metavar(ctx) signature change, so
  # `--help` crashes on a newer click. Pinned rather than left to float.
  "click==8.1.7",
]

[project.optional-dependencies]
dev = ["pytest==8.3.3", "pytest-cov==5.0.0", "hypothesis==6.112.1",
       "mypy==1.11.2", "ruff==0.6.9", "freezegun==1.5.1"]

[project.scripts]
fxbot = "fxbot.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "T20", "RET", "SIM", "ARG", "PTH"]
ignore = ["B008"]  # typer uses function calls in argument defaults by design

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002"]
"scripts/*" = ["T201"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
mypy_path = "src"
packages = ["fxbot"]

[[tool.mypy.overrides]]
module = ["backtrader.*", "MetaTrader5.*", "matplotlib.*", "pyarrow.*"]
ignore_missing_imports = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]
