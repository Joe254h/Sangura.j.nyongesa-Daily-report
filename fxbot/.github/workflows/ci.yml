name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        working-directory: fxbot
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        working-directory: fxbot
        run: ruff check src tests scripts

      - name: Types
        working-directory: fxbot
        run: mypy

      # §12.6 first: an architectural violation should fail before the slow tests run.
      - name: Layering
        working-directory: fxbot
        run: pytest tests/test_layering.py -q

      # §12.1 coverage floors: risk/ 100%, strategy/ 95%, execution/ 90%, the rest 80%.
      - name: Tests and coverage floors
        working-directory: fxbot
        run: |
          pytest -q \
            --cov=fxbot --cov-report=term-missing --cov-report=xml \
            --cov-fail-under=80
          python scripts/check_coverage.py coverage.xml
